services:
  postgres:
    image: postgres:17
    container_name: postgres_loja
    restart: unless-stopped
    environment:
      POSTGRES_DB: loja
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loja"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

api:
    build: .
    container_name: api_loja
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy # A API só liga se o healthcheck do banco passar!
    environment:
      - DB_HOST=postgres # O nome do host agora é o nome do container do banco
      - DB_PORT=5432
      - DB_NAME=loja
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-123456}

volumes:
  postgres_data:
    driver: local